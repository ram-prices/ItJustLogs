<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Arknights: Endfield pull history tracker. Pity, rate-up luck and patch stats. Runs entirely in your browser." />
    <!-- Link previews (Discord etc.). Operator and weapon info pages get their own at build time (vite.config.ts). -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ItJustLogs" />
    <meta property="og:title" content="ItJustLogs · Arknights: Endfield pull tracker" />
    <meta property="og:description" content="Import your Arknights: Endfield pull history to see pity, rate-up luck and patch stats, plus the banner schedule and operator and weapon info. Runs entirely in your browser." />
    <meta property="og:image" content="https://itjustlogs.dev/banner.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ItJustLogs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..500&family=Jost:wght@300..700&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,300..600,0..1,0&icon_names=add,auto_awesome,auto_stories,bar_chart,celebration,check,check_circle,chevron_right,close,cloud,cloud_done,cloud_upload,content_copy,dark_mode,delete,deployed_code,description,desktop_windows,document_scanner,download,drag_indicator,event,event_available,explore,factory,flag,history,home,hourglass_empty,hourglass_full,image,inbox,inventory_2,light_mode,link,menu_book,military_tech,open_in_new,photo_camera,redeem,rocket_launch,search,settings,shuffle,sort,sports_esports,stars,stat_2,swords,sync,timer,tune,upload_file&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try {
        var t = JSON.parse(localStorage.getItem('ijl.settings') || '{}').theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="drop-overlay" aria-hidden="true"><div><div class="heading-20">Drop to import</div><p class="copy-14 secondary" style="margin-top: 6px">Pull history is merged into what's saved.</p></div></div>
    <input type="file" accept=".json,application/json" id="fileInput" hidden />
    <input type="file" accept="image/*" id="avatarInput" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
